<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI BMI Planner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 760px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        h1, h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #c9c9c9;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0b74ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #065ed0;
        }

        .error {
            margin-top: 20px;
            background: #ffe7e7;
            color: #b00000;
            padding: 12px;
            border-radius: 8px;
        }

        .result {
            margin-top: 25px;
            background: #eef7ee;
            padding: 16px;
            border-radius: 10px;
        }

        .plan {
            margin-top: 20px;
            background: #f8fbff;
            border: 1px solid #d9e7ff;
            padding: 18px;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .note {
            color: #555;
            font-size: 14px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BMI Diet Planner</h1>

        <form method="POST">
            {% csrf_token %}

            <label for="height">Height (cm)</label>
            <input type="number" step="any" name="height" id="height" value="{{ height }}" required>

            <label for="weight">Weight (kg)</label>
            <input type="number" step="any" name="weight" id="weight" value="{{ weight }}" required>

            <label for="age">Age</label>
            <input type="number" name="age" id="age" value="{{ age }}" required>

            <label for="gender">Gender</label>
            <select name="gender" id="gender" required>
                <option value="">-- Select Gender --</option>
                <option value="male" {% if gender == "male" %}selected{% endif %}>Male</option>
                <option value="female" {% if gender == "female" %}selected{% endif %}>Female</option>
            </select>

            <button type="submit">Generate AI Plan</button>
        </form>

        {% if error %}
            <div class="error">
                <strong>Error:</strong> {{ error }}
            </div>
        {% endif %}

        {% if bmi %}
            <div class="result">
                <p><strong>BMI:</strong> {{ bmi }}</p>
                <p><strong>Category:</strong> {{ category }}</p>
            </div>
        {% endif %}

        {% if ai_plan %}
            <h2>AI-Generated 1-Month Plan</h2>
            <div class="plan">{{ ai_plan }}</div>
            <p class="note">
                This output is general educational guidance generated by Gemini.
            </p>
        {% endif %}
    </div>
</body>
</html>
